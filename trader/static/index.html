<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>lancome</title>
<link rel="stylesheet" href="/static/css/dashboard.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js@4"></script>
</head>
<body>

<header>
  <h1>lancome</h1>
  <nav>
    <a href="/" class="active">Dashboard</a>
    <a href="/docs">Docs</a>
  </nav>
  <span id="bot-timer"></span>
  <span id="refresh-info"></span>
</header>

<main>
  <div id="alpaca-error"></div>

  <!-- stat cards, grouped: account / activity -->
  <div id="stats"></div>

  <div class="panels">
    <div class="col">
      <section>
        <h2>
          Equity
          <span class="spacer"></span>
          <select id="history-period">
            <option value="1D|5Min">1 day</option>
            <option value="1W|1H">1 week</option>
            <option value="1M|1D" selected>1 month</option>
            <option value="3M|1D">3 months</option>
          </select>
        </h2>
        <div style="height:180px"><canvas id="equity-chart"></canvas></div>
      </section>

      <section>
        <h2>Dynamic Watchlist <span class="count" id="watchlist-count"></span></h2>
        <div id="watchlist"></div>
      </section>
    </div>

    <div class="col">
      <section>
        <h2>Open Positions</h2>
        <div id="positions"></div>
      </section>

      <section>
        <h2>Recent News</h2>
        <div class="list" id="news-feed"></div>
      </section>
    </div>
  </div>

  <section>
    <h2>Event Feed <span class="count" id="event-count"></span></h2>

    <div class="filters">
      <div class="segmented" id="f-event">
        <button data-event="" class="active">All</button>
        <button data-event="signal">Signals</button>
        <button data-event="entry">Entries</button>
        <button data-event="exit">Exits</button>
        <button data-event="news">News</button>
        <button data-event="scanner">Scanner</button>
      </div>
      <select id="f-symbol"><option value="">All symbols</option></select>
      <select id="f-decision">
        <option value="">All verdicts</option>
        <option value="approve">approved</option>
        <option value="veto">vetoed</option>
      </select>
      <input type="text" id="f-q" placeholder="Search rule, reason, indicator…">
      <button id="f-clear">Clear</button>
      <label><input type="checkbox" id="auto-refresh" checked> auto-refresh</label>
    </div>

    <div id="events"></div>

    <div class="pager">
      <button id="pg-prev">‹ Prev</button>
      <span id="pg-info"></span>
      <button id="pg-next">Next ›</button>
    </div>
  </section>
</main>

<script type="module" src="/static/js/dashboard.js"></script>
</body>
</html>
